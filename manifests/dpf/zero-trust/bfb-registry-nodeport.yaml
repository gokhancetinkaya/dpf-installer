# Stable NodePort for the DPU BMC. The operator's bfb-registry Service gets a
# new nodePort whenever it is recreated, so Redfish cannot use that port.
# This Service selects the same pods and keeps ZT_BFB_REGISTRY_PORT.
apiVersion: v1
kind: Service
metadata:
  name: bfb-registry-bmc
  namespace: dpf-operator-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/part-of: bfb-registry
    dpu.nvidia.com/component: bfb-registry
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: ${ZT_BFB_REGISTRY_PORT}
