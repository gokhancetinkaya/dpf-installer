# Every DPU BMC in Zero Trust mode must share this root password (see the
# "Zero Trust DPU BMC Prerequisites" section in README.md). DPF's Redfish
# provisioning path looks this secret up by name.
apiVersion: v1
kind: Secret
metadata:
  name: bmc-shared-password
  namespace: dpf-operator-system
type: Opaque
stringData:
  password: ${ZT_DPU_BMC_ROOT_PASSWORD}
