apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUServiceConfiguration
metadata:
  name: ovn
  namespace: dpf-operator-system
spec:
  deploymentServiceName: "ovn"
  serviceConfiguration:
    helmChart:
      values:
        global:
          enableOvnKubeIdentity: false
        k8sAPIServer: https://${HOST_CLUSTER_API}:${TARGETCLUSTER_API_SERVER_PORT}
        podNetwork: ${OVN_POD_NETWORK}
        serviceNetwork: ${OVN_SERVICE_NETWORK}
        hostNetworkNamespace: "openshift-host-network"
        mtu: ${OVN_MTU}
        dpuManifests:
          kubernetesSecretName: "ovn-dpu"
          vtepCIDR: ${VTEP_CIDR}
          hostCIDR: ${DPU_HOST_CIDR}
          ipamPool: "pool1"
          ipamPoolType: "cidrpool"
          ipamVTEPIPIndex: 0
          ipamPFIPIndex: 1
          cniBinDir: "/var/lib/cni/bin/"
          cniConfDir: "/run/multus/cni/net.d"
